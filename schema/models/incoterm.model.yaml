# =============================================================================
# Domain: Corporate (reference masters)
# Entity: Incoterm + TermsAndConditions
# Description: Two thin reference masters cited by selling/buying as logical FKs.
# Incoterm — the ICC delivery term (FOB, CIF, …) stamped on an order/shipment.
# TermsAndConditions — a reusable named T&C block printed on quotes/orders/invoices.
# Region-neutral; no behavior beyond being referenced.
# =============================================================================

models:
  - name: Incoterm
    collection: incoterms
    description: "An ICC Incoterm (delivery term)"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique incoterm identifier"

      code:
        type: string
        attributes: ["@required", "@max(8)"]
        description: "The 3-letter Incoterm code (FOB, CIF, DDP, …) — unique"

      name:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Full term name"

      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: IncotermStatus
        attributes: ["@default(active)"]
        description: "Lifecycle (inactive terms are hidden from new documents; historical documents keep their delivery term)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: unique
        fields: [code]
        where: "deleted_at IS NULL"

  - name: TermsAndConditions
    collection: terms_and_conditions
    description: "A reusable named terms-and-conditions block"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique T&C identifier"

      code:
        type: string
        attributes: ["@required", "@max(40)"]
        description: "Short unique code"

      title:
        type: string
        attributes: ["@required", "@max(150)"]
        description: "Human title (e.g. 'Standard Sales Terms')"

      body:
        type: string
        attributes: ["@required", "@max(8000)"]
        description: "The full T&C text (printed on quotes/orders/invoices)"

      # replaces is_active (boolean flipped to lifecycle enum)
      status:
        type: TermsAndConditionsStatus
        attributes: ["@default(active)"]
        description: "Lifecycle (inactive blocks are hidden from new documents; issued documents keep their printed text)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: unique
        fields: [code]
        where: "deleted_at IS NULL"

enums:
  - name: IncotermStatus
    description: "Lifecycle of an Incoterm reference row"
    variants:
      - name: active
        description: "Selectable on new documents"
        default: true
      - name: inactive
        description: "Hidden from new documents; historical documents keep their delivery term"

  - name: TermsAndConditionsStatus
    description: "Lifecycle of a terms-and-conditions block"
    variants:
      - name: active
        description: "May be attached to new documents"
        default: true
      - name: inactive
        description: "Hidden from new documents; issued documents keep their printed text"
