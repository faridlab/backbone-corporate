# Codegen policy for corporate.
#
# `user_owned` globs are hand-written files that live inside generator-owned trees but are
# NOT schema-derived. `metaphor schema generate [--force]` skips them wholesale (never reads,
# merges, or deletes them). Everything else in src/ is regenerated from schema/models.
#
# Re-exports/declarations that must sit alongside generated code live inside
# `// <<< CUSTOM ... // END CUSTOM` markers (service/mod.rs, presentation/http/mod.rs, lib.rs)
# and are preserved by the marker mechanism, not listed here.
#
# Add your hand-authored services, handlers, tests, and docs below as you write them.

user_owned:
  # The fence re-statement migration hand-adjusted to the split policy (reads admit
  # global NULL-company fallback rates, writes stay own-only). A naive regen would
  # re-derive a plain-strict stanza and re-break multi-currency consumers — never let
  # the generator own this file.
  - "migrations/20260819100000_company_fence_strict.up.sql"
  - "migrations/20260819100000_company_fence_strict.down.sql"
  # The hand-authored FX conversion engine (effective-dated rate lookup + no-overlap guard).
  - "src/application/service/fx_service.rs"
  # User-owned repositories holding the FX engine's hand-written SQL (overlap check, rate insert,
  # effective-rate lookup, decimal-places read). Same pattern as backbone-pos/banking.
  - "src/infrastructure/persistence/currency_exchange_repository.rs"
  - "src/infrastructure/persistence/currency_repository.rs"

  # AppState carries the FX service for the validated /fx handlers. The generated
  # AppState has no CUSTOM marker, so the file is hand-maintained (same escape
  # hatch as fx_service.rs above).
  - "src/handlers/mod.rs"
  # Rate-table routes default to READ-only and the validated /fx endpoints mount
  # from the CUSTOM block; the stateless composer is hand-edited, so user-own it.
  - "src/routes/mod.rs"

  # Behavior tests (the golden cases / oracle) + BDD features.
  - "tests/features/**"
  - "tests/fx_golden_cases.rs"
  - "tests/integrity_probes.rs"
  - "tests/fx_accounting_seam.rs"
  - "tests/fx_port_facade.rs"
  # The raw spot-rate read (latest-on-or-before over the windowed rate table).
  - "tests/fx_spot_on_or_before.rs"
  - "tests/common/**"

  # Hand-authored module documentation.
  - "docs/**"
